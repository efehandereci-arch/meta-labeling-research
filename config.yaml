# =====================================================================
# META-LABELING RESEARCH FRAMEWORK — KONFİGÜRASYON
#
# ARAŞTIRMA KURALI: Bu değerler ex-ante belirlenir. OOS sonuçlarına bakarak
# eşik, hiperparametre, öznitelik veya bariyer değiştirmek backtest
# overfitting'dir. Değiştirirseniz bu yeni bir deneydir: experiments/
# kaydında görünür ve Deflated Sharpe yorumunda hesaba katılmalıdır.
# =====================================================================

experiment:
  name: meta_labeling_research
  seed: 42
  output_dir: research_output
  log_level: INFO
  save_figures: true
  strict_leakage: true          # leakage tespit edilirse çalışma durur (LeakageError)

data:
  source: simulated             # simulated | csv | yfinance
  tickers: [SASA]               # çoklu: [SASA, THYAO, ASELS, BIMAS, AKBNK, GARAN, EREGL, TUPRS]
  csv_dir: data                 # source=csv -> data/SASA.csv (Date,Open,High,Low,Close,Volume)
  yfinance_suffix: .IS
  yfinance_interval: 1d         # 1d | 1h | 5m (intraday geçmişi: 1h ~730 gün, 5m ~60 gün)
  yfinance_period: 15y
  start: null
  end: null
  constituents_file: null       # tarihsel endeks üyeliği CSV (date,ticker) -> survivorship kontrolü
  simulation:
    n_bars: 4000
    start: "2010-01-04"
    s0: 100.0
    seed: 42
    regime_persistence: 0.99
    trend_drift: 0.0015
    trend_ar: 0.10
    mr_kappa: 0.08
    long_run_vol: 0.015
    garch_alpha: 0.08
    garch_beta: 0.90
    trend_vol_mult: 0.90
    mr_vol_mult: 1.10
    t_dof: 5.0

primary:
  kind: ema                     # ema | bollinger | long (her zaman long; overlay çalışması)
  ema_fast: 10
  ema_slow: 40
  ema_neutral_band: 0.0
  bb_window: 20
  bb_num_std: 1.5

cusum:
  event_mode: cusum             # cusum | signal
  vol_mult: 1.0                 # CUSUM eşiği = vol_mult x σ_t

barriers:
  vol_method: ewma
  vol_span: 50
  pt_mult: 2.0
  sl_mult: 2.0
  max_holding_bars: 10
  min_target: 0.002

features:
  rsi_window: 14
  atr_window: 14
  bb_window: 20
  bb_num_std: 2.0
  vol_fast_span: 10
  vol_slow_span: 50
  autocorr_window: 50
  efficiency_window: 20
  momentum_window: 20
  skew_window: 50
  volume_window: 20

meta_model:
  kind: lgbm                    # lgbm | rf
  threshold: 0.55
  use_side_feature: true
  weighting: uniqueness         # uniqueness | return | none
  n_estimators: 300
  learning_rate: 0.02
  num_leaves: 8
  max_depth: 3
  min_child_samples: 40
  colsample_bytree: 0.8
  reg_lambda: 1.0
  rf_n_estimators: 500
  rf_min_weight_fraction_leaf: 0.05
  n_jobs: 1

cv:
  n_splits: 6
  embargo_pct: 0.01
  min_train_events: 100

cpcv:
  n_groups: 6
  n_test_groups: 2

execution:
  mode: next_open               # next_open: sinyal close(t), işlem open(t+1) | close: MOC (iyimser)
  initial_capital: 1000000.0
  periods_per_year: 252

costs:                          # ana backtest maliyeti (tek yön)
  commission_bps: 5.0
  spread_bps: 0.0
  slippage_bps: 0.0
  impact_k: 0.0                 # rate += k * sqrt(emir_tutarı / ADV)
  adv_window: 20

cost_scenario:                  # parametrik maliyet modeli senaryosu (rapor bölüm 14)
  commission_bps: 5.0
  spread_bps: 10.0
  slippage_bps: 5.0
  impact_k: 0.10
  capital_grid: [1000000.0, 10000000.0, 100000000.0]

sizing:
  method: prob                  # equal | vol_target | prob | prob_vol | kelly | conformal_kelly | conformal_kelly_dial
  step_size: 0.0
  vol_target_annual: 0.15
  kelly_fraction: 0.25
  kelly_fractions: [0.10, 0.25, 0.50]
  conformal:                    # Conformal Kelly (arXiv:2608.01494); varsayılanlar makaleden, OOS'a göre ayarlanmadı
    alpha: 0.25                 # aralık kapsaması 1-α; σ̂ = q_eff / Φ⁻¹(1-α/2)
    window: 500                 # rolling kantil: son N KAPANMIŞ işlemin skoru (yavaş ölçek = makalenin ana bulgusu)
    anchor_lambda: 0.3          # q_eff = q_roll^(1-λ) · q_anchor^λ (genişleyen kantile çekim)
    anchor_refresh: 21          # anchor her 21 yeni skorda güncellenir, arada bayat tutulur
    kappa: 0.25                 # fraksiyonel Kelly: f = κ μ̂ / σ̂²
    score_units: vol            # vol: getiri/σ_t0 (bariyerler σ ölçekli) | raw: düz getiri (makale)
    min_scores: 50              # ısınma: bu kadar skor birikmeden pozisyon yok
    min_payoff_events: 30       # W̄ / L̄ için min. kapanmış kârlı ve zararlı işlem
    dial_window: 21             # drawdown kadranı: son 21 kapanmış işlemde alt ihlal oranı
    dial_beta: 1.0
    dial_floor: 0.25
    dial_placebo_reps: 40       # min p = 1/41 ≈ 0.024 < placebo_alpha

risk:                           # null = devre dışı; varsayılanlar optimize EDİLMEDİ
  max_position: 1.0
  max_gross_exposure: 1.0
  max_daily_loss: null
  max_drawdown_stop: null
  max_turnover: null

calibration:
  methods: [platt, isotonic]
  min_history: 100
  n_bins: 10

benchmarks:
  random_entry_reps: 50

regimes:
  min_history: 252
  vol_low_q: 0.33
  vol_high_q: 0.67
  high_vol_q: 0.80
  trend_sma: 100
  trend_slope_window: 20
  drawdown_window: 252
  crisis_drawdown: -0.20

analysis:
  threshold_grid: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
  cost_grid_bps: [5, 10, 20, 30, 50, 75, 100]
  periods:
    - ["2010-2013", "2010-01-01", "2013-12-31"]
    - ["2014-2016", "2014-01-01", "2016-12-31"]
    - ["2017-2019", "2017-01-01", "2019-12-31"]
    - ["2020", "2020-01-01", "2020-12-31"]
    - ["2021", "2021-01-01", "2021-12-31"]
    - ["2022", "2022-01-01", "2022-12-31"]
    - ["2023", "2023-01-01", "2023-12-31"]
    - ["2024", "2024-01-01", "2024-12-31"]
    - ["2025", "2025-01-01", "2025-12-31"]
    - ["2026", "2026-01-01", "2026-12-31"]
  min_period_coverage: 0.9      # dönemler OOS olaylarının bundan azını kapsıyorsa otomatik dönemler
  auto_period_count: 6
  min_oos_events: 50
  feature_groups:
    atr: [atr_pct, atr_vol_ratio]
    skew: [ret_skew]
    autocorrelation: [autocorr]
    volatility: [vol_ratio, bb_width]
    volume: [volume_z]
    trend: [efficiency, abs_momentum, rsi]
  permutation_repeats: 5
  bootstrap_n: 1000
  bootstrap_block: 20
  # p-değeri tabanı 1/(1+tekrar): p < 0.05 için en az 20 tekrar gerekir
  placebo_label_reps: 20
  placebo_feature_reps: 20
  placebo_return_reps: 20
  placebo_timestamp_reps: 20
  leakage_samples: 30

criteria:                       # robustness geçme kriterleri (ex-ante)
  psr_min: 0.95
  dsr_min: 0.95
  placebo_alpha: 0.05
  random_entry_percentile: 0.95
  min_breakeven_cost_bps: 20.0
  cpcv_min_positive_frac: 0.80
  period_min_positive_frac: 0.60
  min_active_periods: 3

frequency_study:                # python -m meta_labeling.research --frequency-study
  ticker: AAPL                  # strateji parametreleri bar cinsinden AYNI kalır;
  yfinance_suffix: ""           # yalnızca veri frekansı ve yıllıklandırma değişir
  profiles:
    - {name: low, label: "Düşük frekans (günlük)", interval: 1d, period: 15y, periods_per_year: 252, bar_duration: "1 gün"}
    - {name: medium, label: "Orta frekans (saatlik)", interval: 1h, period: 730d, periods_per_year: 1764, bar_duration: "1 saat"}
    - {name: high, label: "Yüksek frekans (5 dakikalık)", interval: 5m, period: 60d, periods_per_year: 19656, bar_duration: "5 dakika"}

diagnostics:                    # python -m meta_labeling.research --diagnostics (yalnızca raporlama)
  feature_shuffle_reps: 3
  seed_noise_reps: 3
  event_placebo_reps: 5
  n_deciles: 10
  sizing_multipliers: [0.25, 0.5, 0.75, 1.0, 1.25]   # max_position (1.0) üstü kırpılır: kaldıraç yok
  run_in_frequency_study: true

overlay:                        # python -m meta_labeling.research --overlay-study (bkz. docs/preregistration/long_overlay.md)
  market_file: null             # piyasa endeksi CSV (Date,Open,High,Low,Close,Volume), ör. data/SPY.csv
  holdout_start: "2014-06-12"   # kilitli test başlangıcı; --dev bu tarihten önceki veriyle çalışır
  trend_features: true          # yönlü öznitelikler: 12-1 momentum, SMA200 uzaklığı, 1 yıllık zirveden düşüş, EMA farkı
  track_record_window: 50       # birincil modelin son 50 KAPANMIŞ işlemindeki isabet oranı / ort. getirisi
  vol_cap: true                 # maruziyet x min(1, σ_ref/σ_t), σ_ref = σ'nın genişleyen medyanı
  vol_cap_min_history: 252
  default_exposure: 1.0         # meta-modelin görüşü yokken tam long (buy & hold)
  placebo_reps: 200             # model olasılıkları olaylar arasında karıştırılır
  bootstrap_reps: 2000          # Sharpe(sistem) - Sharpe(B&H) için eşli durağan bootstrap
  bootstrap_block: 20
  robustness_tickers: [MSFT, JPM, XOM, INTC, KO, WMT, GE]
